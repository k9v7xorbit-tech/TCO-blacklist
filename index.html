<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TCO Blacklist — Registre Officiel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111315;
    --bg-raised:#17191c;
    --line:#2a2d31;
    --line-soft:#212327;
    --ink:#ece8e1;
    --ink-dim:#94989e;
    --ink-faint:#5c6066;
    --high:#e8483c;
    --high-bg:rgba(232,72,60,0.12);
    --medium:#e8a23c;
    --medium-bg:rgba(232,162,60,0.12);
    --low:#4a9b6e;
    --low-bg:rgba(74,155,110,0.12);
  }

  *{box-sizing:border-box;margin:0;padding:0;}

  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Space Grotesk',sans-serif;
    line-height:1.5;
    min-height:100vh;
  }

  .mono{font-family:'IBM Plex Mono',monospace;}

  .masthead{
    border-bottom:1px solid var(--line);
    padding:28px 32px;
    display:flex;
    align-items:flex-end;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:16px;
  }

  .masthead-title{
    font-size:1.9rem;
    font-weight:700;
    letter-spacing:-0.02em;
  }

  .masthead-title .dim{color:var(--ink-faint);font-weight:500;}

  .masthead-sub{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .masthead-stat{
    text-align:right;
  }

  .masthead-stat .num{
    font-family:'IBM Plex Mono',monospace;
    font-size:1.6rem;
    font-weight:600;
    color:var(--ink);
    line-height:1;
  }

  .masthead-stat .label{
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-top:4px;
  }

  .search-zone{
    padding:40px 32px 24px;
    max-width:920px;
    margin:0 auto;
  }

  .search-row{
    display:flex;
    border:1px solid var(--line);
    background:var(--bg-raised);
    border-radius:4px;
    overflow:hidden;
    transition:border-color 0.15s;
  }

  .search-row:focus-within{
    border-color:var(--ink-faint);
  }

  .search-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    padding:16px 18px;
    color:var(--ink);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.95rem;
  }

  .search-row input::placeholder{
    color:var(--ink-faint);
  }

  .search-row .search-icon{
    display:flex;
    align-items:center;
    padding-left:18px;
    color:var(--ink-faint);
  }

  .filter-chips{
    display:flex;
    gap:8px;
    margin-top:14px;
    flex-wrap:wrap;
  }

  .chip{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    padding:6px 12px;
    border:1px solid var(--line);
    border-radius:3px;
    color:var(--ink-dim);
    background:transparent;
    cursor:pointer;
    transition:all 0.12s;
  }

  .chip:hover{
    border-color:var(--ink-faint);
    color:var(--ink);
  }

  .chip.active{
    background:var(--ink);
    color:var(--bg);
    border-color:var(--ink);
  }

  .ledger{
    max-width:920px;
    margin:0 auto;
    padding:0 32px 80px;
  }

  .ledger-head{
    display:grid;
    grid-template-columns:1.4fr 0.7fr 1.6fr 1fr;
    padding:10px 4px;
    border-bottom:1px solid var(--line);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
    letter-spacing:0.03em;
  }

  .entry{
    display:grid;
    grid-template-columns:1.4fr 0.7fr 1.6fr 1fr;
    padding:18px 4px;
    border-bottom:1px solid var(--line-soft);
    align-items:center;
    gap:8px;
  }

  .entry .username{
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:0.95rem;
  }

  .entry .groups{
    font-size:0.78rem;
    color:var(--ink-faint);
    margin-top:3px;
  }

  .rank{
    display:inline-block;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    font-weight:600;
    padding:4px 9px;
    border-radius:3px;
    width:fit-content;
    letter-spacing:0.02em;
  }

  .rank.high{color:var(--high);background:var(--high-bg);}
  .rank.medium{color:var(--medium);background:var(--medium-bg);}
  .rank.low{color:var(--low);background:var(--low-bg);}

  .entry .reason{
    font-size:0.88rem;
    color:var(--ink-dim);
  }

  .entry .date{
    font-family:'IBM Plex Mono',monospace;
    font-size:0.78rem;
    color:var(--ink-faint);
    text-align:right;
  }

  .state-msg{
    text-align:center;
    padding:60px 20px;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono',monospace;
    font-size:0.85rem;
  }

  .state-msg.error{color:var(--high);}

  footer{
    text-align:center;
    padding:24px;
    font-family:'IBM Plex Mono',monospace;
    font-size:0.72rem;
    color:var(--ink-faint);
    border-top:1px solid var(--line);
  }

  @media(max-width:640px){
    .masthead{padding:20px;}
    .masthead-title{font-size:1.4rem;}
    .search-zone{padding:28px 20px 20px;}
    .ledger{padding:0 20px 60px;}
    .ledger-head{display:none;}
    .entry{
      grid-template-columns:1fr;
      gap:6px;
      padding:16px 0;
    }
    .entry .date{text-align:left;}
  }
</style>
</head>
<body>

  <div class="masthead">
    <div>
      <div class="masthead-title">TCO <span class="dim">Blacklist</span></div>
      <div class="masthead-sub">registre public — communauté TCO</div>
    </div>
    <div class="masthead-stat">
      <div class="num mono" id="total-count">—</div>
      <div class="label">joueurs recensés</div>
    </div>
  </div>

  <div class="search-zone">
    <div class="search-row">
      <span class="search-icon">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </span>
      <input type="text" id="search-input" placeholder="Rechercher un pseudo Roblox…">
    </div>
    <div class="filter-chips">
      <button class="chip active" data-rank="all">Tous</button>
      <button class="chip" data-rank="high">High</button>
      <button class="chip" data-rank="medium">Medium</button>
      <button class="chip" data-rank="low">Low</button>
    </div>
  </div>

  <div class="ledger">
    <div class="ledger-head">
      <span>Pseudo</span>
      <span>Rang</span>
      <span>Raison</span>
      <span style="text-align:right;">Ajouté</span>
    </div>
    <div id="entries-container">
      <div class="state-msg" id="loading-msg">Chargement du registre…</div>
    </div>
  </div>

  <footer>TCO Blacklist — dernière synchronisation en direct depuis le registre officiel</footer>

<script>
  /* ============================================================
     CONFIGURATION — à remplir avec tes identifiants Airtable
     ============================================================ */
  const AIRTABLE_BASE_ID = "appLU0A0AjAthgB5z";
  const AIRTABLE_TABLE_NAME = "tco blacklist";
  const AIRTABLE_TOKEN = "patzDqhBrF8hwHg0b.patzDqhBrF8hwHg0b.90febef36985e0cabf3b" + "baab1901a331e1a1fde6a0fe9270d4ca7b502f8e4560";
";
  /* ============================================================ */

  let allEntries = [];
  let currentRankFilter = "all";
  let currentSearch = "";

  async function fetchEntries() {
    const container = document.getElementById('entries-container');
    try {
      const url = `https://api.airtable.com/v0/${AIRTABLE_BASE_ID}/${encodeURIComponent(AIRTABLE_TABLE_NAME)}`;
      const res = await fetch(url, {
        headers: { Authorization: `Bearer ${AIRTABLE_TOKEN}` }
      });

      if (!res.ok) throw new Error('request failed');

      const data = await res.json();
      allEntries = data.records.map(r => ({
        id: r.id,
        username: r.fields.Username || '',
        rank: (r.fields.Rank || 'low').toLowerCase(),
        reason: r.fields.Reason || '',
        groups: r.fields.Groups || '',
        date: r.fields.DateAdded || ''
      }));

      document.getElementById('total-count').textContent = allEntries.length;
      renderEntries();
    } catch (err) {
      container.innerHTML = `<div class="state-msg error">Impossible de charger le registre. Vérifie la configuration Airtable dans le code.</div>`;
      document.getElementById('total-count').textContent = '0';
    }
  }

  function renderEntries() {
    const container = document.getElementById('entries-container');
    const filtered = allEntries.filter(e => {
      const matchesRank = currentRankFilter === 'all' || e.rank === currentRankFilter;
      const matchesSearch = e.username.toLowerCase().includes(currentSearch.toLowerCase());
      return matchesRank && matchesSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = `<div class="state-msg">Aucun joueur ne correspond à cette recherche.</div>`;
      return;
    }

    container.innerHTML = filtered.map(e => `
      <div class="entry">
        <div>
          <div class="username">${escapeHtml(e.username)}</div>
          ${e.groups ? `<div class="groups">${escapeHtml(e.groups)}</div>` : ''}
        </div>
        <div><span class="rank ${e.rank}">${e.rank}</span></div>
        <div class="reason">${escapeHtml(e.reason)}</div>
        <div class="date">${escapeHtml(e.date)}</div>
      </div>
    `).join('');
  }

  function escapeHtml(str) {
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  document.getElementById('search-input').addEventListener('input', (e) => {
    currentSearch = e.target.value;
    renderEntries();
  });

  document.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentRankFilter = chip.dataset.rank;
      renderEntries();
    });
  });

  fetchEntries();
</script>
</body>
</html>
