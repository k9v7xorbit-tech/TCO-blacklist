<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCO Blacklist</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #121212; color: #ffffff; padding: 20px; }
        h1, h2 { color: #ff3333; }
        .card { background-color: #1e1e1e; padding: 15px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        input, button, textarea { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; background: #2a2a2a; color: white; border: 1px solid #444; border-radius: 4px; }
        button { background-color: #ff3333; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #cc0000; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #333; padding: 10px; text-align: left; }
        th { background-color: #2a2a2a; color: #ff3333; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>TCO Blacklist</h1>

    <!-- PUBLIC SECTION (READ ONLY) -->
    <div class="card">
        <h2>Blacklisted Players</h2>
        <table>
            <thead>
                <tr>
                    <th>Roblox Username</th>
                    <th>Reason</th>
                    <th>Date</th>
                    <th class="admin-only hidden">Action</th>
                </tr>
            </thead>
            <tbody id="blacklist-table">
                <!-- Players will be listed here -->
            </tbody>
        </table>
    </div>

    <!-- ADMIN LOGIN -->
    <div class="card" id="login-section">
        <h2>Admin Login</h2>
        <input type="password" id="password-input" placeholder="Enter admin password">
        <button onclick="login()">Log In</button>
        <p id="error-msg" style="color: red; display: none;">Incorrect password!</p>
    </div>

    <!-- ADMIN PANEL -->
    <div class="card hidden" id="admin-panel">
        <h2>Admin Dashboard (Logged In)</h2>
        <button onclick="logout()" style="background-color: #555;">Log Out</button>
        <h3>Add Player</h3>
        <input type="text" id="player-name" placeholder="Roblox Username">
        <textarea id="player-reason" placeholder="Reason for blacklist"></textarea>
        <button onclick="addPlayer()">Add to Blacklist</button>
    </div>

    <script>
        // SHA-256 hash of password 'X9#vL2$mP7!kR4qW'
        const PASSWORD_HASH = "815f15ca85f9502a50a3ee41a1a45749f55e5b3ee58129e612cb7cf5ff9b2e26";

        // SHA-256 Hash Function
        async function hashString(str) {
            const buffer = new TextEncoder().encode(str);
            const digest = await crypto.subtle.digest('SHA-256', buffer);
            return Array.from(new Uint8Array(digest)).map(b => b.toString(16).padStart(2, '0')).join('');
        }

        // Get blacklist from localStorage
        function getBlacklist() {
            return JSON.parse(localStorage.getItem('tco_blacklist') || '[]');
        }

        function saveBlacklist(list) {
            localStorage.setItem('tco_blacklist', JSON.stringify(list));
            renderTable();
        }

        // Admin Login
        async function login() {
            const input = document.getElementById('password-input').value;
            const inputHash = await hashString(input);

            if (inputHash === PASSWORD_HASH) {
                sessionStorage.setItem('isAdmin', 'true');
                updateAdminUI(true);
                document.getElementById('error-msg').style.display = 'none';
                document.getElementById('password-input').value = '';
            } else {
                document.getElementById('error-msg').style.display = 'block';
            }
        }

        function logout() {
            sessionStorage.removeItem('isAdmin');
            updateAdminUI(false);
        }

        function checkAuth() {
            return sessionStorage.getItem('isAdmin') === 'true';
        }

        // Toggle UI for Admin
        function updateAdminUI(isAdmin) {
            const adminPanel = document.getElementById('admin-panel');
            const loginSection = document.getElementById('login-section');
            const adminCols = document.querySelectorAll('.admin-only');

            if (isAdmin) {
                adminPanel.classList.remove('hidden');
                loginSection.classList.add('hidden');
                adminCols.forEach(col => col.classList.remove('hidden'));
            } else {
                adminPanel.classList.add('hidden');
                loginSection.classList.remove('hidden');
                adminCols.forEach(col => col.classList.add('hidden'));
            }
            renderTable();
        }

        // Add Player
        function addPlayer() {
            if (!checkAuth()) return;
            const name = document.getElementById('player-name').value.trim();
            const reason = document.getElementById('player-reason').value.trim();

            if (!name || !reason) {
                alert("Please fill in all fields!");
                return;
            }

            const list = getBlacklist();
            list.push({
                id: Date.now(),
                name: name,
                reason: reason,
                date: new Date().toLocaleDateString('en-US')
            });

            saveBlacklist(list);
            document.getElementById('player-name').value = '';
            document.getElementById('player-reason').value = '';
        }

        // Delete Player
        function deletePlayer(id) {
            if (!checkAuth()) return;
            let list = getBlacklist();
            list = list.filter(item => item.id !== id);
            saveBlacklist(list);
        }

        // Render Table
        function renderTable() {
            const list = getBlacklist();
            const tbody = document.getElementById('blacklist-table');
            const isAdmin = checkAuth();
            tbody.innerHTML = '';

            if (list.length === 0) {
                tbody.innerHTML = '<tr><td colspan="' + (isAdmin ? 4 : 3) + '">No blacklisted players found.</td></tr>';
                return;
            }

            list.forEach(item => {
                const tr = document.createElement('tr');
                let html = `<td><strong>${item.name}</strong></td><td>${item.reason}</td><td>${item.date}</td>`;
                if (isAdmin) {
                    html += `<td><button onclick="deletePlayer(${item.id})" style="padding: 5px 10px;">Remove</button></td>`;
                }
                tr.innerHTML = html;
                tbody.appendChild(tr);
            });
        }

        // Initialize
        window.onload = function() {
            updateAdminUI(checkAuth());
        };
    </script>
</body>
</html>
